plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Create, Ponder, Flywheel
    maven {
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    // Registrate
    maven {
        url = 'https://mvn.devos.one/snapshots'
        content { includeGroup 'com.tterrag.registrate' }
    }
    // Numismatics
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // A second client for multiplayer testing, e.g. two players watching the same market. Separate game
        // directory so options and logs don't collide with the first client.
        client2 {
            client()
            gameDirectory = project.file('run-client2')
            programArguments.addAll '--username', 'Dev2'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered GameTest, then exits.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Tests use the small example catalog; the built-in prices are checked by loading their files directly.
            systemProperty 'dynamiceconomy.skipDefaultPrices', 'true'
        }

        // `gradlew runClient -PjoinServer=127.0.0.1:25565` launches straight into that server.
        [client, client2].each { run ->
            if (project.hasProperty('joinServer')) {
                run.programArguments.addAll '--quickPlayMultiplayer', project.property('joinServer').toString()
            }
        }

        configureEach { run ->
            // In dev, Numismatics re-reads log4j.configurationFile with URI.create(), which throws on a plain Windows
            // path containing spaces. Give it the same file MDG generates, as a valid file: URI.
            systemProperty 'log4j.configurationFile', project.file("build/moddev/${run.name}Log4j2.xml").toURI().toString()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // `-PdebugLog` for debug output, e.g. the market packets a client receives.
            logLevel = project.hasProperty('debugLog') ? org.slf4j.event.Level.DEBUG : org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Create's POM pulls in many optional runtime mods (JEI, FTB, JourneyMap...), so take the slim jar
    // without transitives and add the libraries it bundles explicitly.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") { transitive = false }
    implementation("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }

    implementation("maven.modrinth:numismatics:${numismatics_version}") { transitive = false }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            loader_version_range     : loader_version_range,
            create_version_range     : create_version_range,
            numismatics_version_range: numismatics_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
